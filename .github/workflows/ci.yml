name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Where jobs run comes from CI_RUNS_ON (same as qqbot).
    # Unset falls back to ubuntu-24.04; currently ["self-hosted","qqbot-ci"].
    # A pull request from a fork always runs on a GitHub-hosted runner: once the repository is public, anyone can open
    # one, and its code must never run on the self-hosted machine (Joye-Co/qqbot#1535).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:compat 要取到上一个 v* tag
      # 开发和 CI 用 Node 24，直接运行 .ts；用户侧 engines 是 >=20，由最后的冒烟测试守住。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated schema is up to date
        run: npm run check:schema
      - name: docs/mcp.md matches the schema
        run: npm run check:contract
      - name: No breaking change since the last release
        run: npm run check:compat
      - run: npm run build
      - run: npm run check:pack
      - run: npm run validate:server-json
      - run: npm run check:secrets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dist/ runs on Node 20
        run: npm run smoke:dist
      - name: the packed tarball starts through npx on Node 20
        run: npm run smoke:pack
